<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Shield/Circle -->
  <rect width="128" height="128" rx="28" fill="url(#crestGrad)"/>
  <rect x="6" y="6" width="116" height="116" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Academic Crest Laurel / Star Motif -->
  <circle cx="64" cy="28" r="4" fill="url(#goldGrad)"/>
  
  <!-- Monogram Letter N -->
  <path d="M 40 40 L 40 88 M 40 40 L 88 88 M 88 40 L 88 88" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Base Academic Seal Ribbon -->
  <path d="M 36 100 Q 64 108 92 100" 
        fill="none" 
        stroke="#94a3b8" 
        stroke-width="3" 
        stroke-linecap="round"/>
</svg>
